<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>KoSam Korean Restaurant &amp; Bar · Before &amp; after</title>
<meta name="description" content="Turns a one-photo page into a guide to both restaurants, in English and Korean.">
<meta property="og:type" content="website"><meta property="og:title" content="KoSam Korean Restaurant &amp; Bar · Before &amp; after"><meta property="og:description" content="Turns a one-photo page into a guide to both restaurants, in English and Korean."><meta property="og:url" content="https://mooque-dev.github.io/restaurant-concepts/for/kosam/"><meta property="og:image" content="https://mooque-dev.github.io/restaurant-concepts/kosam/thumb.jpg"><meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23141414%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2212%22 fill=%22%23ff5a36%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--ink:#141414;--mute:#6b6760;--line:#14141418;--hot:#ff5a36;--acc:#ff5a36}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 Inter,sans-serif;padding:24px 28px 80px}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px;font-size:14px}
.top a{text-decoration:none;font-weight:600}
.switch{display:flex;gap:6px;flex-wrap:wrap}
.switch a{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:500}
.switch a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
h1{font:400 clamp(36px,4.6vw,58px)/1 'Instrument Serif';letter-spacing:-.015em}
h1 i{color:var(--acc)}
.sub{color:var(--mute);margin:10px 0 20px;max-width:760px;font-size:16px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:#fff;border-radius:99px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:8px 18px;border-radius:99px;font:600 12px Inter;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.hint{font-size:12.5px;color:var(--mute)}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pane label{display:flex;justify-content:space-between;font:600 11px Inter;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;color:var(--mute)}
.pane label b{color:var(--acc)}
.pane label a{text-transform:none;letter-spacing:0;font-weight:500}
.view{height:78vh;background:#1b1b1b;border-radius:14px;overflow:hidden;position:relative}
.before{overflow-y:auto;background:#fff}
.before img{display:block;width:100%}
.view iframe{border:0;background:#fff;transform-origin:top left;position:absolute;left:0;top:0}
.mobile .view{background:#ddd8cf;display:flex;justify-content:center;align-items:flex-start}
.mobile .before{overflow:hidden}
.mobile .before .scroller{width:390px;height:calc(100% - 40px);margin-top:20px;border-radius:30px;border:8px solid #141414;overflow-y:auto;background:#fff}
.mobile .view iframe{position:relative;transform:none!important;width:390px!important;height:calc(100% - 40px)!important;margin-top:20px;border-radius:30px;border:8px solid #141414}
h2{font:400 34px 'Instrument Serif';margin:56px 0 16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:14.5px}
th{text-align:left;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:14px 18px;background:#faf8f5}
td{padding:16px 18px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font:400 21px 'Instrument Serif';white-space:nowrap}
td.after{background:color-mix(in srgb,var(--acc) 7%,#fff)}
.next{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.nx{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.nx span{display:inline-block;font:600 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--ink);padding:4px 9px;border-radius:99px;margin-bottom:10px}
.nx span.Launch{background:var(--acc)}
.cta{margin-top:40px;display:flex;gap:12px;flex-wrap:wrap}
.copy{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:600 12px Inter;cursor:pointer}
.ownerNote{margin-top:40px;color:var(--mute);font-size:14px;max-width:640px}
body.share .top{display:none}
.pick{display:flex;align-items:center;gap:8px;font-weight:500}
.pick select{height:40px;border-radius:99px;border:1px solid var(--line);background:#fff;padding:0 14px;font:600 14px Inter;max-width:60vw}
.evidence{background:#fff;border-radius:14px;padding:18px 20px;max-width:880px;font-size:15.5px}
.nobefore{padding:36px 28px;font-size:16px;line-height:1.6;color:#333}
.nobefore b{display:block;font:400 30px/1.1 'Instrument Serif';margin-bottom:6px;color:#111}
.nobefore small{display:block;color:#777;margin-bottom:18px}
.nobefore li{margin:0 0 10px 18px}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 22px;border-radius:99px;font:600 14px Inter;border:1.5px solid var(--ink);text-decoration:none}
.btn.fill{background:var(--ink);color:#fff}
.confirm{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:8px;max-width:820px}.confirm li{padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;position:relative;background:#fff;font-size:15px;line-height:1.45}.confirm li:before{content:"";position:absolute;left:14px;top:14px;width:14px;height:14px;border:1.5px solid var(--ink);border-radius:4px}
@media(max-width:1000px){.panes{grid-template-columns:1fr}body{padding:18px 16px 60px}td:first-child{white-space:normal}}
</style></head><body>

<div class="top" id="teamNav"><a href="directory.html" id="backLink">← Directory</a><label class="pick">Concept <select id="switch" aria-label="Choose a concept"></select></label><button class="copy" id="copyOwner" type="button">Copy owner link</button></div>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="bar">
 <div class="seg" id="mode"><button class="on" data-m="desktop">Desktop</button><button data-m="mobile">Mobile</button></div>

 <span class="hint" id="hint"></span>
</div>
<div class="panes" id="panes">
 <div class="pane"><label><span id="beforeLabel">Before</span> <a id="liveLink" target="_blank" rel="noopener">open live ↗</a></label><div class="view before"><div class="scroller"><img id="beforeImg" alt="Current website, full page"><div class="nobefore" id="noBefore" hidden></div></div></div></div>
 <div class="pane"><label><b>After · concept</b> <a id="conceptLink" target="_blank">open full screen ↗</a></label><div class="view"><iframe id="after" title="Concept"></iframe></div></div>
</div>

<div id="evWrap" hidden><h2>What we found</h2><p class="evidence" id="evidence"></p></div>

<div id="ixWrap" hidden><h2>Interaction concepts</h2><div class="next" id="ix"></div></div>

<div id="cfWrap"><h2>Please confirm</h2><p class="evidence" style="margin-bottom:10px">Everything here comes from public sources. Before anything goes live, these need a yes from you.</p><ul class="confirm" id="confirm"></ul></div>

<h2>What changed</h2>
<table><thead><tr><th style="width:150px">Area</th><th>Before</th><th>After</th></tr></thead><tbody id="changes"></tbody></table>

<h2>What could come next</h2>
<div class="next" id="next"></div>
<div class="cta" id="teamCta"><a class="btn fill" href="directory.html">Back to the directory</a></div>
<div id="teamOnly"><h2>Team notes</h2><div class="next" id="teamNotes"></div></div>
<p class="ownerNote" id="ownerNote" hidden></p>

<script>window.OWNER="kosam";window.STUDIO={"name":"Mooque Studio"};window.CONCEPTS=[{"id":"kosam","name":"KoSam Korean Restaurant & Bar","short":"KoSam","category":"food","accent":"#c8262d","pitch":"Turns a one-photo page into a guide to both restaurants, in English and Korean.","interactions":[["Menu search","Type \"비빔밥\" or \"tofu\" and the menu filters across every tab."],["How-to-eat stepper","Three tappable steps for first-timers."],["Location switcher","Sheppard and Leslie share one card with live hours."],["Bilingual","One tap between English and Korean."]],"changes":[["First screen","One large soup photo with \"Premium Korean Restaurant\" in spaced letters. Hours and locations are on another page.","Story, photo and two clear buttons: find a location, see the menu."],["Security","No HTTPS, so Chrome labels the site \"Not secure\".","HTTPS by default on modern hosting."],["Menu","Five separate PDF and PNG files that download to the phone.","The full menu on the page: 52 items in five tabs, with Korean names and a search box. Nothing to download."],["Locations","Separate page with plain-text hours.","Side-by-side cards with live open / closed status, today highlighted, call and directions."],["Language","English only.","One-tap Korean toggle for headings, hours and key copy."],["Brand","KoSam and Koryo Samgyetang names, two Instagram handles, never explained.","Explains it: Leslie is also known as Koryo Samgyetang; Sheppard is KoSam, with a bar and a seasonal patio."],["Reviews","Yelp quotes from 2021, labelled \"Yelp Reviewer #1\".","The same quotes, presented cleanly. Current Google reviews can come next."]],"next":[["Launch","Put the new site on kosam.ca with HTTPS."],["Add-on","Photo shoot: only three dish photos are online, and two are 412 pixels wide."],["Add-on","Google Business Profile clean-up for both locations, with matching names and hours."],["Care","Menu and price updates for two locations."]],"confirm":["Menu prices, copied from your menu PDF on 15 Nov 2026.","Which items are Sheppard only: fried chicken and cheese tonkatsu.","Hours for each location.","How you want the two names explained: KoSam and Koryo Samgyetang.","The review quotes: they are Yelp quotes from 2021. Newer ones would be better."],"live":"http://kosam.ca/","beforeDate":"13 Nov 2026","group":"active"}];</script>
<script>
// window.OWNER is set only on the built owner pages (for/<id>/), which carry one concept and nothing else.
const Q=new URLSearchParams(location.search),ALL=window.CONCEPTS.filter(x=>x.group!=='hidden'),id=window.OWNER||Q.get('c')||ALL[0].id,c=ALL.find(x=>x.id===id)||ALL[0],C=ALL.filter(x=>x.group==='active'||x===c);
const CATS=[['food','Restaurants & cafés'],['artist','Artists & musicians']];
const artist=c.category==='artist';
// Owner view (?share=1): no links to other concepts, the team hub, sources or archive
const share=!!window.OWNER||Q.get('share')==='1';
if(share){document.body.classList.add('share');['teamCta','teamNav','teamOnly'].forEach(i=>document.getElementById(i).remove());const on=document.getElementById('ownerNote');on.hidden=false;on.textContent=(artist?'This is a design sketch based on public information about your work. It uses none of your photos; photos, dates and contact details are placeholders until you supply them.':'This is a design concept made with your public photos, menu and hours.')+' Questions or changes? Reply to the message this link came with.';}
else{
 const sel=document.getElementById('switch');
 sel.innerHTML=CATS.map(([k,l])=>`<optgroup label="${l}">${C.filter(x=>x.category===k).map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${x.name}</option>`).join('')}</optgroup>`).join('');
 sel.onchange=()=>{location.search='?c='+sel.value};
 document.getElementById('backLink').href='directory.html?show='+c.category;
 document.getElementById('copyOwner').onclick=async function(){const u=new URL((c.group==='active'?'for/'+c.id+'/':'compare.html?c='+c.id+'&share=1'),location.href);try{await navigator.clipboard.writeText(u.href);this.textContent='Copied ✓'}catch(e){prompt('Owner link:',u.href)}};
 const notes=[];
 if(c.sources)notes.push(['Sources',c.sources.join(' · ')]);
 if(!artist)notes.push(['Older versions',`<a href="archive/#${c.id}">Archive: first draft and playful v2</a>`]);
 if(artist)notes.push(['Status',c.status+' · '+c.work]);
 if(c.group==='history')notes.push(['Archived','An earlier sketch, kept for reference. It is not in the main directory.']);
 if(c.teamNote)notes.push(['Note',c.teamNote]);
 if(artist)notes.push(['Not checked','Instagram and other social bios sit behind a login and were not read. Look for a link in bio before sending.']);
 notes.push(['Before captured',c.beforeDate+'. These states change; re-check before sending.']);
 document.getElementById('teamNotes').innerHTML=notes.map(([t,d])=>`<div class="nx"><span>${t}</span><div>${d}</div></div>`).join('');
}
document.documentElement.style.setProperty('--acc',c.accent);
document.title=c.name+' · Before & After';
document.getElementById('title').innerHTML=`${c.name}, <i>before &amp; after</i>`;
document.getElementById('sub').textContent=c.pitch;
document.getElementById('hint').textContent=(c.noBefore?'There is no site to capture, so Before is an illustration. ':'Before is a capture of the current page. ')+'After is the working '+(artist?'sketch':'concept')+': scroll it, tap it, try the buttons.';
document.getElementById('beforeLabel').textContent=(c.noBefore?'Before · illustration, not a screenshot':'Before · captured '+c.beforeDate);
const live=document.getElementById('liveLink');if(c.liveUnsafe){const t=document.createElement('span');t.className='hint';t.textContent=c.live.replace(/^https?:\/\/|\/$/g,'')+' · not linked: '+c.liveUnsafe;live.replaceWith(t)}else if(c.live){live.href=c.live}else{live.remove()}
document.getElementById('conceptLink').href=c.id+'/';
const img=document.getElementById('beforeImg'),fr=document.getElementById('after'),panes=document.getElementById('panes');
fr.src=c.id+'/';
if(c.noBefore){img.remove();const nb=document.getElementById('noBefore');nb.hidden=false;nb.innerHTML=`<b>No official website</b><small>Illustration of what a search finds (${c.beforeDate})</small><ul>${c.noBefore.map(x=>`<li>${x}</li>`).join('')}</ul>`}
function setMode(m){
 panes.classList.toggle('mobile',m==='mobile');
 if(!c.noBefore)img.src=`${c.id}/before-${m}.jpg`;fit();
}
function fit(){
 const v=fr.parentElement;
 if(panes.classList.contains('mobile')){fr.style.transform='';return}
 const W=1440,s=v.clientWidth/W;fr.style.width=W+'px';fr.style.height=(v.clientHeight/s)+'px';fr.style.transform=`scale(${s})`;
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#mode button').forEach(x=>x.classList.toggle('on',x===b));setMode(b.dataset.m)});
addEventListener('resize',fit);setMode('desktop');
if(c.evidence){document.getElementById('evWrap').hidden=false;document.getElementById('evidence').textContent=c.evidence}
if(c.interactions){document.getElementById('ixWrap').hidden=false;document.getElementById('ix').innerHTML=c.interactions.map(([t,d])=>`<div class="nx"><b style="display:block;font:400 22px 'Instrument Serif';margin-bottom:4px">${t}</b><div>${d}</div></div>`).join('')}
const cf=c.confirm||(artist?['The short bio and the facts in it.','The list of works: titles, years and order.','A booking email and any agent or label contact.','Press photos we may use. The sketch uses none of your photos.','Show dates, or that the section should stay empty for now.','The address the site should live on.']:[]);
if(cf.length){document.getElementById('confirm').innerHTML=cf.map(x=>`<li>${x}</li>`).join('')}else{document.getElementById('cfWrap').remove()}
document.getElementById('changes').innerHTML=c.changes.map(([a,b,f])=>`<tr><td>${a}</td><td>${b}</td><td class="after">${f}</td></tr>`).join('');
document.getElementById('next').innerHTML=c.next.map(([t,d])=>`<div class="nx"><span class="${t}">${t}</span><div>${d}</div></div>`).join('');
</script>
</body></html>
